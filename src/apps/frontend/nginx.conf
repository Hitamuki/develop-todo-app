# /src/apps/frontend/nginx.conf

server {
    listen 80;
    server_name localhost; # This will be ignored when running in ECS behind an ALB

    # Root directory for Angular static files, matches Dockerfile COPY destination
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Standard Angular routing: try to serve file, then directory, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Configuration for caching static assets
    # location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
    #     expires 1y;
    #     add_header Cache-Control "public";
    # }

    # Optional: Gzip compression for text-based assets
    # gzip on;
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Health check endpoint (optional, can be useful for ECS health checks if ALB target group points here)
    location = /nginx_health {
        access_log off;
        return 200 "Healthy";
        add_header Content-Type text/plain;
    }
}
