<div class="container">
  <div class="row justify-content-center w-100">
    <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <mat-card class="login-card">
        <mat-card-header>
          <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" placeholder="Enter your email">
              <mat-icon matPrefix>email</mat-icon>
              <mat-error *ngIf="loginForm.controls['email'].hasError('required')">
                Email is required
              </mat-error>
              <mat-error *ngIf="loginForm.controls['email'].hasError('email') && !loginForm.controls['email'].hasError('required')">
                Please enter a valid email address
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Password</mat-label>
              <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
              <mat-icon matPrefix>lock</mat-icon>
              <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.controls['password'].hasError('required')">
                Password is required
              </mat-error>
            </mat-form-field>

            <div *ngIf="errorMessage" class="alert alert-danger mt-3">
              {{ errorMessage }}
            </div>

            <div class="d-grid gap-2 mt-4">
              <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="w-100 py-2">
                Login
              </button>
            </div>
          </form>
        </mat-card-content>
        <mat-card-actions class="text-center">
          <p class="mb-0">
            Don't have an account? <a routerLink="/register" class="text-primary">Register here</a>
          </p>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
