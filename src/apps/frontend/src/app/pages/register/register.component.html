<div>
  <h1>Register</h1>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="model.name" required #name="ngModel">
      <div *ngIf="name.invalid && (name.dirty || name.touched)" class="alert alert-danger">
        Name is required.
      </div>
    </div>
    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="model.email" required email #email="ngModel">
      <div *ngIf="email.invalid && (email.dirty || email.touched)" class="alert alert-danger">
        <div *ngIf="email.errors?.['required']">Email is required.</div>
        <div *ngIf="email.errors?.['email']">Email must be a valid email address.</div>
      </div>
    </div>
    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" [(ngModel)]="model.password" required minlength="6" #password="ngModel">
      <div *ngIf="password.invalid && (password.dirty || password.touched)" class="alert alert-danger">
        <div *ngIf="password.errors?.['required']">Password is required.</div>
        <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters long.</div>
      </div>
    </div>
    <div>
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      <div *ngIf="registerForm.submitted && password.value !== confirmPassword" class="alert alert-danger">
        Passwords must match.
      </div>
    </div>
    <button type="submit" [disabled]="registerForm.invalid || password.value !== confirmPassword">Register</button>
  </form>
  <div *ngIf="registrationError" class="alert alert-danger">
    {{ registrationError }}
  </div>
  <div *ngIf="registrationSuccess" class="alert alert-success">
    Registration successful! You can now log in.
  </div>
</div>
